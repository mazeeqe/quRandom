[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrand"
version = "0.3.0"
description = "Noise-aware quantum random numbers - Qollab Hackathon submission"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["qiskit>=2.0,<3"]

[project.optional-dependencies]
plot = ["matplotlib"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["qrand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
